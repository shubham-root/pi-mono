[package]
name = "pi-tools"
version = "0.1.0"
edition = "2024"
description = "Tool framework and built-in tools (bash, read, write, edit, grep, find, ls)"
license = "MIT"

[dependencies]
# Workspace
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Tool-specific
schemars = "0.8"
difflib = "0.4"

# Shell escaping
shell-words = "1.1"

# Tokio utilities
tokio-util = "0.7"

# Base64 for read tool
base64 = "0.22"

# Regex for grep
regex = "1.10"

# Glob pattern matching for find
globset = "0.4"

# File system walking with .gitignore support
ignore = "0.4"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
serial_test = "3.0"

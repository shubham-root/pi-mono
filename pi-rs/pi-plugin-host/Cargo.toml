[package]
name = "pi-plugin-host"
version = "0.1.0"
edition = "2024"
description = "WASM plugin host runtime for pi-rs"
license = "MIT"

[dependencies]
# Workspace
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

# WASM runtime
wasmtime = { version = "18.0", features = ["runtime", "component-model"] }
wasmtime-wasi = "18.0"

# Protobuf
prost = "0.13"
prost-types = "0.13"
bytes = "1.0"

# Plugin SDK
pi-plugin-sdk = { path = "../pi-plugin-sdk" }

# Tokio
tokio-util = "0.7"

[build-dependencies]
prost-build = "0.13"

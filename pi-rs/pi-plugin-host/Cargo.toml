[package]
name = "pi-plugin-host"
version = "0.1.0"
edition = "2024"
description = "WASM plugin host runtime for pi-rs"
license = "MIT"

[dependencies]
# Workspace
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Protocol types shared with the plugin SDK.
pi-plugin-protocol = { path = "../pi-plugin-protocol" }

# Manifest parsing.
toml = "0.8"

# WASM runtime.
wasmtime = { version = "18.0", default-features = false, features = [
    "runtime",
    "cranelift",
    "parallel-compilation",
    "wat",
] }
wasmtime-wasi = "18.0"

# Utilities.
bytes = "1.0"

[dev-dependencies]
tempfile = "3.10"
wat = "1.0"

[package]
name = "pi-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for building pi-rs plugins. Compile to wasm32-wasip2."
license = "MIT"

[lib]
# The plugin itself is usually a `cdylib` crate; this SDK is a plain
# library that plugins depend on.
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
pi-plugin-protocol = { path = "../pi-plugin-protocol" }

[dev-dependencies]

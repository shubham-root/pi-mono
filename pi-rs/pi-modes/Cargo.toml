[package]
name = "pi-modes"
version = "0.1.0"
edition = "2024"
description = "Execution modes: print, interactive, and RPC"
license = "MIT"

[dependencies]
# Workspace
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

# pi-*
pi-ai = { path = "../pi-ai" }
pi-core = { path = "../pi-core" }
pi-tools = { path = "../pi-tools" }
pi-tui = { path = "../pi-tui" }

# TUI
ratatui = { version = "0.27", default-features = false, features = ["crossterm", "serde"] }
crossterm = "0.28"
chrono = "0.4"
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
once_cell = "1"
arboard = { version = "3", default-features = false }
url = "2"
dirs = "5"

# For print mode
atty = "0.2"

[dev-dependencies]
tempfile = "3.10"

[package]
name = "pi-cli"
version = "0.1.0"
edition = "2024"
description = "CLI entry point for pi-rs"
license = "MIT"

[[bin]]
name = "piz"
path = "src/main.rs"

[dependencies]
# Workspace
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

# pi-*
pi-ai = { path = "../pi-ai" }
pi-core = { path = "../pi-core" }
pi-tools = { path = "../pi-tools" }
pi-modes = { path = "../pi-modes" }
pi-server = { path = "../pi-server" }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_derive = "4.5"

# Environment
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3.10"
